name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: mongodb://127.0.0.1:27017/todo-ci-placeholder
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Fork PRs cannot access repository secrets; their build uses a synthetic public key.
      - name: Validate required secrets
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          missing=false
          if [ -z "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" ]; then
            echo "::error title=Missing required secret::NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY must be configured."
            missing=true
          fi
          if [ "$missing" = true ]; then
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build
        env:
          # Synthetic public key for fork-only build checks; it is not backed by a Clerk instance.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'pk_test_Y2ktb25seS1wbGFjZWhvbGRlci5jbGVyay5hY2NvdW50cy5kZXYk' || secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
